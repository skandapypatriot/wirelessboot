name: Build ESP32-C3 Recovery Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: riscv32imc-unknown-none-elf
          components: llvm-tools-preview

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO esptool
        run: |
          python -m pip install platformio

      - name: Build Rust firmware
        run: |
          cargo build --release --target riscv32imc-unknown-none-elf

      - name: Convert ELF to ESP32 image binary
        run: |
          ESPTOOL=$(python -c "import platformio; import os; print(os.path.expanduser('~/.platformio/packages/tool-esptool/esptool.py'))")
          python $ESPTOOL --chip esp32c3 elf2image -o release/recovery.bin target/riscv32imc-unknown-none-elf/release/wirelessboot-recovery
          ls -la release/recovery.bin

      - name: Upload recovery.bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-bin
          path: release/recovery.bin
          retention-days: 30

      - name: Upload partitions.csv artifact
        uses: actions/upload-artifact@v4
        with:
          name: partitions-csv
          path: release/partitions.csv
          retention-days: 30

      - name: Upload ota_client.py artifact
        uses: actions/upload-artifact@v4
        with:
          name: ota-client
          path: release/ota_client.py
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download recovery.bin artifact
        uses: actions/download-artifact@v4
        with:
          name: recovery-bin
          path: release/

      - name: Download partitions.csv artifact
        uses: actions/download-artifact@v4
        with:
          name: partitions-csv
          path: release/

      - name: Download ota_client.py artifact
        uses: actions/download-artifact@v4
        with:
          name: ota-client
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/recovery.bin
            release/partitions.csv
            release/ota_client.py
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ESP32-C3 Unbrickable BLE Recovery Firmware

            ## Install in your PlatformIO Arduino project:

            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ## Flash manually:

            ```powershell
            python .platformio\packages\tool-esptool\esptool.py --chip esp32c3 write_flash ^
              0x0 bootloader.bin ^
              0x8000 partitions.csv ^
              0x190000 recovery.bin
            ```

            ## Trigger recovery:

            Hold BOOT (GPIO9) on power-up, or let ota_0 corruption auto-fallback.

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}