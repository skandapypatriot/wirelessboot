[env:esp32c3]
platform = espressif32
board = esp32c3-devkitm-1
framework = espidf
monitor_speed = 115200

; Size optimization
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DNDEBUG
    -DCONFIG_COMPILER_OPTIMIZATION_SIZE=1
    -DCONFIG_COMPILER_OPTIMIZATION_LEVEL="-Os"
    -DCONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE=1
    -DCONFIG_COMPILER_OPTIMIZATION_CHECKS_SILENT=1
    -DCONFIG_LOG_DEFAULT_LEVEL_NONE=1
    -DCONFIG_LOG_MAXIMUM_LEVEL=0
    -DCONFIG_BOOTLOADER_LOG_LEVEL_NONE=1
    -DCONFIG_VFS_SUPPORT_TERMIOS=0
    -DCONFIG_VFS_SUPPORT_SELECT=0
    -DCONFIG_VFS_SUPPORT_IOCTL=0
    -DCONFIG_VFS_SUPPORT_DIR=0
    -DCONFIG_LWIP_ENABLE=0
    -DCONFIG_WIFI_ENABLED=0
    -DCONFIG_BT_CLASSIC_ENABLED=0
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=0
    -DCONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=0
    -DCONFIG_BT_NIMBLE_GATT_MAX_SERVICES=1
    -DCONFIG_BT_NIMBLE_GATT_MAX_ATTRS=8
    -DCONFIG_BT_NIMBLE_HS_FLOW_CTRL=0
    -DCONFIG_BT_NIMBLE_MESH=0
    -DCONFIG_BT_NIMBLE_CRYPTO_STACK_MBEDTLS=1
    -DCONFIG_BT_NIMBLE_SM_LEGACY=0
    -DCONFIG_BT_NIMBLE_SM_SC=0
    -DCONFIG_BT_NIMBLE_KEY_SIZE=16
    -DCONFIG_BT_CONTROLLER_BLE_MAX_CONN=1
    -DCONFIG_BT_CONTROLLER_BLE_MAX_ACT=0
    -DCONFIG_BT_CONTROLLER_BLE_HW_FEAT_EN=0
    -DCONFIG_BT_CONTROLLER_BLE_DUP_SCAN_FILTER=0
    -DCONFIG_BT_CONTROLLER_BLE_ADV_REPORT_FLOW_CTRL=0
    -DCONFIG_BT_CONTROLLER_BLE_MESH=0
    -DCONFIG_BT_CONTROLLER_BLE_50_FEATURES_SUPPORT=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_MSYS_BUF_COUNT=8
    -DCONFIG_BT_NIMBLE_MSYS_BUF_SIZE=256
    -DCONFIG_APP_ROLLBACK_ENABLE=0
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=0
    -DCONFIG_BOOTLOADER_WDT_ENABLE=0
    -DCONFIG_ESP_TASK_WDT=0
    -DCONFIG_ESP_INT_WDT=0
    -DCONFIG_ESP_SYSTEM_PANIC_SILENT_REBOOT=1
    -DCONFIG_ESP_SYSTEM_PANIC_GDBSTUB=0
    -DCONFIG_ESP_SYSTEM_PANIC_PRINT_REBOOT=0
    -DCONFIG_DEBUG_UART=0
    -DCONFIG_LOG_BOOTLOADER_LEVEL_NONE=1
    -DCONFIG_NEWLIB_NANO_FORMAT=1
    -DCONFIG_ESP_BROWNOUT_DET=0
    -DCONFIG_SPI_FLASH_CACHE2RAM_SIZE=0
    -DCONFIG_ESP_HTTP_SERVER=0
    -DCONFIG_NVS_ENCRYPTION=0
    -DCONFIG_ESP_COREDUMP_ENABLE_TO_NONE=1
    -DCONFIG_FREERTOS_TASK_FUNCTION_WRAPPER=0
    -DCONFIG_FREERTOS_CHECK_STACKOVERFLOW_NONE=1
    -DCONFIG_FREERTOS_WATCHPOINT_END_OF_STACK=0
    -DCONFIG_FREERTOS_INTERRUPT_BACKTRACE=0
    -DCONFIG_BOOTLOADER_SKIP_VALIDATE_IN_DEEP_SLEEP=1
    -DCONFIG_BOOTLOADER_SKIP_VALIDATE_ON_POWER_ON=1
    -DCONFIG_BOOTLOADER_SKIP_FLASH_CONFIG=1
    -DCONFIG_ESP_SYSTEM_ALLOW_RTC_FAST_MEM_AS_HEAP=0
    -DCONFIG_ESP_SYSTEM_MEMPROT_FEATURE=0
    -DCONFIG_ESP_SYSTEM_MEMPROT_FEATURE_LOCK=0

; Partition table
board_build.partitions = partition_table/partitions.csv

; Flash settings
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.flash_size = 4MB

; Custom SDK config
board_build.embed_txtfiles = 
    sdkconfig.defaults

; Build type
build_type = release

; Advanced: reduce IRAM usage
build_unflags = 
    -Og
    -O2
    -O3