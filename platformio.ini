; PlatformIO config for ESP32-C3 Arduino projects using wirelessboot recovery
; This file is PATCHED by install.ps1 to add board_build.partitions

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Partition table is set by install.ps1:
;   board_build.partitions = .wirelessboot/partitions.csv
; (factory at 0x190000, app0/ota_0 at 0x10000)

; Size optimization
build_flags = 
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DNDEBUG

build_type = release