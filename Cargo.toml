[package]
name = "wirelessboot-recovery"
version = "0.1.0"
edition = "2021"
description = "Bare-metal BLE OTA Recovery for ESP32-C3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skandapypatriot/wirelessboot"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[dependencies]
# Bare-metal ESP32-C3 HAL only - avoids windows-sys dependency chain
esp-hal = { version = "1.2.2", features = ["esp32c3", "rt"] }

# Heapless for small buffers (no windows-sys)
heapless = "0.8"

[workspace]
members = []